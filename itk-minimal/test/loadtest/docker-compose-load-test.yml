version: '3.7'
networks:
  mojaloop-itk-net:
    name: mojaloop-itk-net
    driver: bridge

services:

  mojaloop-connector-load-test:
    networks:
      - mojaloop-itk-net
    image: mojaloop/sdk-scheme-adapter:latest
    env_file: ./mojaloop-connector-load-test.env
    ports:
      - "4040:4000"
      - "4001:4001"
      - "4002:4002"
      - "9229:9229"
    depends_on:
      - redis
    command: yarn nx run modules-api-svc:start
    volumes:
      - ./secrets:/opt/app/secrets
    healthcheck:
      test: [
        "CMD" , "curl", "-f", "http://localhost:4001"
      ]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s
    extra_hosts:
      - mojapi1:192.168.2.10

  redis:
    networks:
      - mojaloop-itk-net
    image: "redis:6.2.4-alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD" ,"sh", "-c", "redis-cli","ping"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s

  k6:
    image: grafana/k6
    networks:
      - mojaloop-itk-net
    depends_on:
      - mojaloop-connector-load-test
    volumes:
      - ./k6-load-test-script.js:/scripts/k6-load-test-script.js
    entrypoint: ["k6", "run", "/scripts/k6-load-test-script.js"]