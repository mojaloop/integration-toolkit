<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 500" role="img" aria-label="ITK architecture: the participant's own systems on the left, the ITK stack in the middle, and the MDK-deployed Mojaloop Hub across the organisation boundary on the right">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- own background so the diagram reads identically on light and dark pages -->
  <rect x="0" y="0" width="1210" height="500" fill="#ffffff"/>

  <!-- organisation boundary -->
  <line x1="785" y1="80" x2="785" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="785" y="64" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#64748b">organisation boundary — public internet</text>

  <!-- ===================== Participant-provided (participant side) ===================== -->
  <rect x="20" y="70" width="200" height="400" rx="10" fill="#eef4fb" stroke="#7ba2c9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#33506b">Participant-provided</text>

  <!-- Core banking system -->
  <rect x="40" y="250" width="160" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="120" y="271" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Core banking system</text>
  <text x="120" y="287" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">production backend</text>

  <!-- Observability server -->
  <rect x="40" y="391" width="160" height="52" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="120" y="412" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Observability server</text>
  <text x="120" y="428" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">metrics &amp; logs backend</text>

  <!-- ===================== ITK ===================== -->
  <rect x="250" y="70" width="480" height="400" rx="10" fill="#eef4fb" stroke="#7ba2c9" stroke-width="1.5"/>
  <text x="266" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#33506b">Participant infrastructure — Integration Toolkit (ITK)</text>

  <!-- Vault -->
  <rect x="280" y="110" width="170" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="365" y="129" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Vault</text>
  <text x="365" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">participant private keys &amp; PKI</text>

  <!-- MCM Agent -->
  <rect x="520" y="110" width="180" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="610" y="129" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">MCM Agent</text>
  <text x="610" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">enrolment &amp; cert automation</text>

  <!-- Redis -->
  <rect x="280" y="185" width="170" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="365" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Redis</text>
  <text x="365" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">adapter cache</text>

  <!-- SDK Scheme Adapter -->
  <rect x="520" y="250" width="180" height="60" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="610" y="273" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">SDK Scheme Adapter</text>
  <text x="610" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">FSPIOP · mTLS · JWS · ILP</text>

  <!-- Simulator (dashed = bundled test stand-in) -->
  <rect x="280" y="330" width="170" height="46" rx="6" fill="#fbfcfe" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="365" y="349" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Simulator</text>
  <text x="365" y="365" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">test-profile CBS stand-in</text>

  <!-- Alloy (dashed = optional) -->
  <rect x="520" y="395" width="180" height="44" rx="6" fill="#fbfcfe" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="610" y="413" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">Grafana Alloy</text>
  <text x="610" y="429" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">telemetry — obs profile</text>

  <!-- internal arrows -->
  <line x1="520" y1="133" x2="456" y2="133" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="487" y="125" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">AppRole</text>

  <line x1="610" y1="250" x2="610" y2="161" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">connects (WS) — receives</text>
  <text x="618" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">live TLS + JWS keys</text>

  <path d="M 520 262 L 488 262 L 488 208 L 456 208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="496" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">cache</text>

  <path d="M 560 310 L 560 353 L 456 353" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="568" y="338" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">test profile</text>

  <!-- BYO wires -->
  <line x1="520" y1="276" x2="206" y2="276" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="362" y="266" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">REST — SDK backend API</text>

  <line x1="520" y1="417" x2="206" y2="417" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="362" y="407" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">metrics + logs (opt-in)</text>

  <!-- ===================== Hub (MDK side) ===================== -->
  <rect x="850" y="70" width="340" height="290" rx="10" fill="#f6f1fb" stroke="#a58cc5" stroke-width="1.5"/>
  <text x="866" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#5b4a7a">Mojaloop Hub — deployed with MDK</text>

  <rect x="880" y="106" width="280" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1020" y="123" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">MCM</text>
  <text x="1020" y="139" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">Connection Manager API</text>

  <rect x="880" y="169" width="280" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1020" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">IAM — Ory Hydra</text>
  <text x="1020" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">OAuth2 token issuer</text>

  <rect x="880" y="247" width="280" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1020" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1f2937">FSPIOP extapi</text>
  <text x="1020" y="280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">mTLS + OAuth2 termination · scheme CA</text>

  <line x1="1020" y1="289" x2="1020" y2="302" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1030" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">HTTP</text>
  <rect x="880" y="306" width="280" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="1020" y="327" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1f2937">ALS · Quoting · Central Ledger</text>

  <!-- cross-boundary arrows -->
  <line x1="700" y1="127" x2="874" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="786" y="105" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">enrols, renews certificates</text>
  <text x="786" y="119" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">HTTPS</text>

  <path d="M 700 145 L 766 145 L 766 190 L 874 190" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="784" y="181" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">OAuth2 client_credentials</text>
  <text x="784" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569">HTTPS</text>

  <line x1="700" y1="274" x2="874" y2="274" stroke="#0e7490" stroke-width="2.5" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="786" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0e7490">FSPIOP traffic</text>
  <text x="786" y="262" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7490">mTLS + JWS, both directions</text>
</svg>
